<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masrofaty</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="theme-color" content="#14332f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Masrofaty">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="./styles.css?v=5">
</head>
<body>
<div id="boot">Loading… / جارٍ التحميل…</div>
<div id="fatal" hidden></div>
<header><div><h1 data-i18n="appName">مصروفاتي</h1><small class="by">Mohamed Elmahdy</small></div><button id="lang" type="button">English</button></header>
<main id="app" hidden>
 <section id="dashboard" class="view">
  <label class="field"><span data-i18n="month"></span><input type="month" id="dMonth"></label>
  <div class="hero"><small data-i18n="monthTotal"></small><b id="dTotal" data-v="0">0</b></div>
  <div class="two">
   <div class="stat debit"><small>Debit</small><b id="dDebit" data-v="0">0</b></div>
   <div class="stat credit"><small>Credit</small><b id="dCredit" data-v="0">0</b></div>
  </div>
  <p class="count"><span data-i18n="txCount"></span> <b id="dCount">0</b></p>
  <h2 data-i18n="latest"></h2><ul id="dList" class="list"></ul>
  <footer class="copy"><span data-i18n="rights"></span><a href="tel:+201110903840" dir="ltr">+201110903840</a></footer>
 </section>
 <section id="add" class="view" hidden>
  <h2 id="formTitle"></h2>
  <form id="form" novalidate>
   <label class="field"><span data-i18n="amount"></span><input id="fAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"><em class="err" id="eAmount"></em></label>
   <label class="field"><span data-i18n="date"></span><input id="fDate" type="date"><em class="err" id="eDate"></em></label>
   <label class="field"><span data-i18n="acctType"></span><select id="fType"><option value="debit" data-i18n="debitOpt"></option><option value="credit" data-i18n="creditOpt"></option></select></label>
   <label class="field"><span data-i18n="reason"></span><input id="fReason" type="text" maxlength="120" data-i18n-ph="reasonPh"><em class="err" id="eReason"></em></label>
   <button class="btn primary" id="fSave" type="submit" data-i18n="save"></button>
   <button class="btn" id="fCancel" type="button" data-i18n="cancelEdit" hidden></button>
  </form>
 </section>
 <section id="history" class="view" hidden>
  <h2 data-i18n="history"></h2>
  <div class="filters">
   <input type="month" id="hMonth" data-i18n-aria="month">
   <select id="hType" data-i18n-aria="acctType"><option value="" data-i18n="allTypes"></option><option value="debit">Debit</option><option value="credit">Credit</option></select>
   <input type="search" id="hSearch" data-i18n-ph="searchPh">
   <select id="hSort"><option value="desc" data-i18n="sortNew"></option><option value="asc" data-i18n="sortOld"></option></select>
   <button class="btn small" id="hAll" type="button" data-i18n="allMonths"></button>
  </div>
  <p class="count"><span data-i18n="total"></span> <b id="hTotal" data-v="0">0</b> — <span data-i18n="countLbl"></span> <b id="hCount">0</b></p>
  <ul id="hList" class="list"></ul>
 </section>
 <section id="budget" class="view" hidden>
  <h2 data-i18n="budget"></h2>
  <label class="field"><span data-i18n="month"></span><input type="month" id="bMonth"></label>
  <label class="field" for="bAmount"><span data-i18n="monthlyBudget"></span></label>
  <div class="inl"><input id="bAmount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00"><button class="btn small" id="bSaveTotal" type="button" data-i18n="saveBudget"></button></div>
  <em class="err" id="eBTotal"></em>
  <div class="hero"><small data-i18n="sBudget"></small><b id="bTotal" data-v="0">0</b></div>
  <div class="two">
   <div class="stat"><small data-i18n="sPlanned"></small><b id="bPlanned" data-v="0">0</b></div>
   <div class="stat" id="bLeftBox"><small data-i18n="sLeft"></small><b id="bLeft" data-v="0">0</b></div>
   <div class="stat debit"><small data-i18n="sPaid"></small><b id="bPaid" data-v="0">0</b></div>
   <div class="stat credit"><small data-i18n="sUnpaid"></small><b id="bUnpaid" data-v="0">0</b></div>
  </div>
  <p class="note" data-i18n="budgetNote"></p>
  <h2 data-i18n="planTitle"></h2>
  <form id="bForm" novalidate>
   <div class="bform"><input id="bName" type="text" maxlength="60" data-i18n-ph="itemPh"><input id="bItemAmt" type="number" inputmode="decimal" step="0.01" min="0" data-i18n-ph="itemAmtPh"></div>
   <em class="err" id="eBItem"></em>
   <button class="btn primary" id="bAdd" type="submit"></button>
   <button class="btn" id="bCancel" type="button" data-i18n="cancelEdit" hidden></button>
  </form>
  <ul id="bList" class="list"></ul>
 </section>
 <section id="backup" class="view" hidden>
  <h2 data-i18n="backup"></h2>
  <button class="btn primary" id="bJson" type="button" data-i18n="bJson"></button>
  <button class="btn" id="bCsv" type="button" data-i18n="bCsv"></button>
  <label class="btn file"><span data-i18n="bImp"></span><input type="file" id="bFile" accept="application/json,.json" hidden></label>
  <p class="note" data-i18n="bNote"></p>
 </section>
</main>
<div id="toast" role="status" aria-live="polite" hidden></div>
<nav id="nav" hidden>
 <button data-v="dashboard" class="on" data-i18n="navHome"></button>
 <button data-v="add" data-i18n="navAdd"></button>
 <button data-v="history" data-i18n="navHist"></button>
 <button data-v="budget" data-i18n="navBudget"></button>
 <button data-v="backup" data-i18n="navBackup"></button>
</nav>
<script src="./app.js?v=5"></script>
</body>
</html>
